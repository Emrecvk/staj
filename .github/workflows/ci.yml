name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Unit Tests
      run: dotnet test tests/Cevik.BirimTestleri/Cevik.BirimTestleri.csproj --configuration Release --no-build --verbosity normal

    - name: Integration Tests (with Testcontainers)
      run: dotnet test tests/Cevik.EntegrasyonTestleri/Cevik.EntegrasyonTestleri.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration_test_results.trx"

    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Docker Build
      run: docker build -t cevik-api:${{ github.sha }} -f Dockerfile .
