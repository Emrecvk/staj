name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: NuGet Cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Unit Tests
      run: dotnet test tests/Cevik.BirimTestleri/Cevik.BirimTestleri.csproj --configuration Release --no-build --verbosity normal

    - name: Integration Tests (with Testcontainers)
      run: dotnet test tests/Cevik.EntegrasyonTestleri/Cevik.EntegrasyonTestleri.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration_test_results.trx"

    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Docker Build
      run: docker build -t cevik-api:${{ github.sha }} -f Dockerfile .

  # Frontend ayri bir is: backend testleriyle paralel kossun, biri digerini
  # beklemesin. Onceki surumde frontend hic denetlenmiyordu — lint 37 hatayla
  # kirmizi oldugu halde CI yesil gorunuyordu.
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint
      working-directory: frontend
      run: npm run lint

    # frontend/tests altındaki 36 paket / 209 test yerelde geçiyordu ama CI'da
    # hiç koşmuyordu; kırıldıklarında kimse görmeyecekti.
    - name: Test
      working-directory: frontend
      run: npm test

    - name: Build
      working-directory: frontend
      run: npm run build

    - name: Docker Build
      run: docker build -t cevik-frontend:${{ github.sha }} -f frontend/Dockerfile frontend
